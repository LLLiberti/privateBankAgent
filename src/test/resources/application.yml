spring:
  datasource:
    url: jdbc:h2:mem:private_bank;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
private-bank:
  security:
    jwt:
      secret: test-secret-test-secret-test-secret-123456
      issuer: private-bank-test
      ttl-minutes: 120
      renewal-threshold-minutes: 30
  graph:
    enabled: false
  storage:
    root: ./target/test-storage
    max-file-size-bytes: 1048576
