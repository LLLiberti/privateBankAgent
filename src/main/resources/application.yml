spring:
  application:
    name: private-bank-backend
  datasource:
    url: ${PRIVATE_BANK_DB_URL:jdbc:mysql://47.116.18.232:3306/private_bank_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${PRIVATE_BANK_DB_USERNAME}
    password: ${PRIVATE_BANK_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

private-bank:
  security:
    jwt:
      secret: ${PRIVATE_BANK_JWT_SECRET}
      issuer: private-bank-backend
      ttl-minutes: 120
      renewal-threshold-minutes: 30
  storage:
    root: ${PRIVATE_BANK_STORAGE_ROOT:./storage}
    max-file-size-bytes: 20971520
  idempotency:
    ttl-minutes: 180
