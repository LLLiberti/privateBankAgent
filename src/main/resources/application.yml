spring:
  application:
    name: private-bank-backend
  datasource:
    url: ${PRIVATE_BANK_DB_URL:jdbc:mysql://47.116.18.232:3306/private_bank_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${PRIVATE_BANK_DB_USERNAME}
    password: ${PRIVATE_BANK_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 1
      connection-timeout: 10000
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  elasticsearch:
    uris: ${PRIVATE_BANK_ES_URIS:}
    username: ${PRIVATE_BANK_ES_USERNAME:}
    password: ${PRIVATE_BANK_ES_PASSWORD:}
  neo4j:
    uri: ${PRIVATE_BANK_NEO4J_URI:}
    authentication:
      username: ${PRIVATE_BANK_NEO4J_USERNAME:}
      password: ${PRIVATE_BANK_NEO4J_PASSWORD:}
    database: ${PRIVATE_BANK_NEO4J_DATABASE:}
  ai:
    model:
      chat: deepseek
    deepseek:
      base-url: ${PRIVATE_BANK_DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${PRIVATE_BANK_DEEPSEEK_API_KEY:}
      chat:
        options:
          model: ${PRIVATE_BANK_DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
    vectorstore:
      type: none
      qdrant:
        host: ${PRIVATE_BANK_QDRANT_HOST:}
        port: ${PRIVATE_BANK_QDRANT_PORT:6334}
        api-key: ${PRIVATE_BANK_QDRANT_API_KEY:}
        collection-name: ${PRIVATE_BANK_QDRANT_COLLECTION:}
        content-field-name: ${PRIVATE_BANK_QDRANT_CONTENT_FIELD:doc_content}
        use-tls: ${PRIVATE_BANK_QDRANT_USE_TLS:false}
        initialize-schema: ${PRIVATE_BANK_QDRANT_INITIALIZE_SCHEMA:false}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false
    db-config:
      update-strategy: not_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

private-bank:
  security:
    jwt:
      secret: ${PRIVATE_BANK_JWT_SECRET}
      issuer: private-bank-backend
      ttl-minutes: 120
      renewal-threshold-minutes: 30
  storage:
    root: ${PRIVATE_BANK_STORAGE_ROOT:./storage}
    max-file-size-bytes: 20971520
  idempotency:
    ttl-minutes: 180
